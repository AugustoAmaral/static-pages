<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Mensagem de Entrega</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-card: #141416;
            --bg-input: #1a1a1e;
            --border: #2a2a30;
            --border-focus: #4a9eff;
            --text-primary: #f5f5f7;
            --text-secondary: #8e8e93;
            --accent: #4a9eff;
            --accent-glow: rgba(74, 158, 255, 0.15);
            --success: #30d158;
            --warning: #ff9f0a;
        }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(ellipse at 20% 0%, rgba(74, 158, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(48, 209, 88, 0.05) 0%, transparent 50%);
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            color: var(--text-primary);
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .checkbox-option {
            flex: 1;
            min-width: 140px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .checkbox-label:hover {
            border-color: var(--text-secondary);
        }

        .checkbox-label.active {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .checkbox-label input {
            display: none;
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .checkbox-label.active .checkbox-custom {
            background: var(--accent);
            border-color: var(--accent);
        }

        .checkbox-custom svg {
            width: 12px;
            height: 12px;
            stroke: var(--bg-primary);
            stroke-width: 3;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.15s ease;
        }

        .checkbox-label.active .checkbox-custom svg {
            opacity: 1;
            transform: scale(1);
        }

        .checkbox-text {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .valor-input {
            margin-top: 0.75rem;
            display: none;
        }

        .valor-input.visible {
            display: block;
        }

        .valor-input input {
            padding-left: 2rem;
        }

        .valor-wrapper {
            position: relative;
        }

        .valor-wrapper::before {
            content: 'R$';
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-generate {
            width: 100%;
            padding: 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--bg-primary);
            background: linear-gradient(135deg, var(--accent) 0%, #6bb3ff 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-generate:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(74, 158, 255, 0.3);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .btn-clear {
            width: 100%;
            padding: 0.875rem 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--warning);
            background: rgba(255, 159, 10, 0.1);
            border: 1px solid rgba(255, 159, 10, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .btn-clear:hover {
            background: rgba(255, 159, 10, 0.15);
            border-color: rgba(255, 159, 10, 0.5);
        }

        .output-section {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .output-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .output-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .btn-copy {
            padding: 0.5rem 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--success);
            background: rgba(48, 209, 88, 0.1);
            border: 1px solid rgba(48, 209, 88, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-copy:hover {
            background: rgba(48, 209, 88, 0.15);
        }

        .btn-copy.copied {
            color: var(--text-primary);
            background: var(--success);
            border-color: var(--success);
        }

        .output-text {
            width: 100%;
            min-height: 180px;
            padding: 1rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            resize: none;
            outline: none;
            cursor: default;
        }

        .output-text:focus {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(48, 209, 88, 0.15);
        }

        /* Autocomplete dropdown */
        .autocomplete-wrapper {
            position: relative;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .autocomplete-list.visible {
            display: block;
        }

        .autocomplete-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.15s ease;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover,
        .autocomplete-item.selected {
            background: var(--accent-glow);
        }

        .autocomplete-item mark {
            background: transparent;
            color: var(--accent);
            font-weight: 600;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }

            .card {
                padding: 1.25rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            .checkbox-group {
                flex-direction: column;
            }

            .checkbox-option {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Gerador de Mensagem</h1>
            <p class="subtitle">Preencha os dados e gere a mensagem para envio</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="nome">Nome do Cliente</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="nome" placeholder="Ex: Ana Carolina Moreira" autocomplete="off">
                    <div class="autocomplete-list" id="nome-list"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="telefone" placeholder="(XX) XXXXX-XXXX" autocomplete="off">
                    <div class="autocomplete-list" id="telefone-list"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="endereco">Endereço</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="endereco" placeholder="Ex: Rua das Flores, 123 - Centro" autocomplete="off">
                    <div class="autocomplete-list" id="endereco-list"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="notas">Notas / Detalhes</label>
                <textarea id="notas" placeholder="Ex: Entregar após às 14h, ligar antes..."></textarea>
            </div>

            <div class="form-group">
                <label>Status do Pagamento</label>
                <div class="checkbox-group">
                    <div class="checkbox-option">
                        <label class="checkbox-label active" id="pago-label">
                            <input type="radio" name="pagamento" id="pago" value="pago" checked>
                            <span class="checkbox-custom">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <path d="M5 13l4 4L19 7" stroke="currentColor"/>
                                </svg>
                            </span>
                            <span class="checkbox-text">Pago</span>
                        </label>
                    </div>
                    <div class="checkbox-option">
                        <label class="checkbox-label" id="apagar-label">
                            <input type="radio" name="pagamento" id="apagar" value="apagar">
                            <span class="checkbox-custom">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <path d="M5 13l4 4L19 7" stroke="currentColor"/>
                                </svg>
                            </span>
                            <span class="checkbox-text">A Pagar</span>
                        </label>
                    </div>
                </div>
                <div class="valor-input" id="valor-container">
                    <div class="valor-wrapper">
                        <input type="text" id="valor" placeholder="0,00">
                    </div>
                </div>
            </div>

            <button class="btn-clear" id="btn-limpar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14ZM10 11v6M14 11v6"/>
                </svg>
                Limpar Campos
            </button>

            <button class="btn-generate" id="btn-gerar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Gerar Mensagem
            </button>
        </div>

        <div class="card output-section" id="output-section">
            <div class="output-header">
                <span class="output-title">Mensagem Gerada</span>
                <button class="btn-copy" id="btn-copy">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                    </svg>
                    <span id="copy-text">Copiar</span>
                </button>
            </div>
            <textarea class="output-text" id="output" readonly></textarea>
        </div>
    </div>

    <script>
        // Storage keys
        const STORAGE_KEYS = {
            nomes: 'msg_generator_nomes',
            telefones: 'msg_generator_telefones',
            enderecos: 'msg_generator_enderecos'
        };

        // Load saved values from localStorage
        function loadSavedValues(key) {
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : [];
            } catch {
                return [];
            }
        }

        // Save value to localStorage
        function saveValue(key, value) {
            if (!value.trim()) return;
            
            const values = loadSavedValues(key);
            const normalized = value.trim();
            
            // Remove if exists and add to beginning
            const filtered = values.filter(v => v.toLowerCase() !== normalized.toLowerCase());
            filtered.unshift(normalized);
            
            // Keep only last 50 values
            const toSave = filtered.slice(0, 50);
            localStorage.setItem(key, JSON.stringify(toSave));
        }

        // Format phone number
        function formatPhone(value) {
            const numbers = value.replace(/\D/g, '');
            
            if (numbers.length <= 2) {
                return numbers.length ? `(${numbers}` : '';
            } else if (numbers.length <= 7) {
                return `(${numbers.slice(0, 2)}) ${numbers.slice(2)}`;
            } else {
                return `(${numbers.slice(0, 2)}) ${numbers.slice(2, 7)}-${numbers.slice(7, 11)}`;
            }
        }

        // Setup autocomplete for an input
        function setupAutocomplete(inputId, listId, storageKey) {
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);
            let selectedIndex = -1;

            function showSuggestions(filter = '') {
                const values = loadSavedValues(storageKey);
                const filtered = values.filter(v => 
                    v.toLowerCase().includes(filter.toLowerCase())
                );

                if (filtered.length === 0 || (filtered.length === 1 && filtered[0].toLowerCase() === filter.toLowerCase())) {
                    list.classList.remove('visible');
                    return;
                }

                list.innerHTML = filtered.slice(0, 8).map((value, index) => {
                    const highlighted = value.replace(
                        new RegExp(`(${filter})`, 'gi'),
                        '<mark>$1</mark>'
                    );
                    return `<div class="autocomplete-item" data-index="${index}" data-value="${value}">${highlighted}</div>`;
                }).join('');

                list.classList.add('visible');
                selectedIndex = -1;
            }

            function selectItem(value) {
                input.value = value;
                list.classList.remove('visible');
                selectedIndex = -1;
            }

            input.addEventListener('focus', () => showSuggestions(input.value));
            
            input.addEventListener('input', () => {
                showSuggestions(input.value);
            });

            input.addEventListener('blur', () => {
                setTimeout(() => list.classList.remove('visible'), 150);
            });

            input.addEventListener('keydown', (e) => {
                const items = list.querySelectorAll('.autocomplete-item');
                
                if (!list.classList.contains('visible') || items.length === 0) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                    items.forEach((item, i) => item.classList.toggle('selected', i === selectedIndex));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = Math.max(selectedIndex - 1, 0);
                    items.forEach((item, i) => item.classList.toggle('selected', i === selectedIndex));
                } else if (e.key === 'Enter' && selectedIndex >= 0) {
                    e.preventDefault();
                    selectItem(items[selectedIndex].dataset.value);
                } else if (e.key === 'Escape') {
                    list.classList.remove('visible');
                }
            });

            list.addEventListener('click', (e) => {
                const item = e.target.closest('.autocomplete-item');
                if (item) {
                    selectItem(item.dataset.value);
                }
            });
        }

        // Initialize autocompletes
        setupAutocomplete('nome', 'nome-list', STORAGE_KEYS.nomes);
        setupAutocomplete('telefone', 'telefone-list', STORAGE_KEYS.telefones);
        setupAutocomplete('endereco', 'endereco-list', STORAGE_KEYS.enderecos);

        // Phone formatting
        const telefoneInput = document.getElementById('telefone');
        telefoneInput.addEventListener('input', (e) => {
            const cursorPos = e.target.selectionStart;
            const oldLength = e.target.value.length;
            e.target.value = formatPhone(e.target.value);
            const newLength = e.target.value.length;
            
            // Adjust cursor position
            const newPos = cursorPos + (newLength - oldLength);
            e.target.setSelectionRange(newPos, newPos);
        });

        // Payment options
        const pagoLabel = document.getElementById('pago-label');
        const apagarLabel = document.getElementById('apagar-label');
        const valorContainer = document.getElementById('valor-container');
        const pagoInput = document.getElementById('pago');
        const apagarInput = document.getElementById('apagar');

        pagoLabel.addEventListener('click', () => {
            pagoLabel.classList.add('active');
            apagarLabel.classList.remove('active');
            valorContainer.classList.remove('visible');
        });

        apagarLabel.addEventListener('click', () => {
            apagarLabel.classList.add('active');
            pagoLabel.classList.remove('active');
            valorContainer.classList.add('visible');
        });

        // Format currency
        const valorInput = document.getElementById('valor');
        valorInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value) {
                value = (parseInt(value) / 100).toFixed(2).replace('.', ',');
            }
            e.target.value = value;
        });

        // Generate message
        const btnGerar = document.getElementById('btn-gerar');
        const outputSection = document.getElementById('output-section');
        const output = document.getElementById('output');

        btnGerar.addEventListener('click', () => {
            const nome = document.getElementById('nome').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const notas = document.getElementById('notas').value.trim();
            const pago = pagoLabel.classList.contains('active');
            const apagar = apagarLabel.classList.contains('active');
            const valor = valorInput.value.trim();

            // Save values for autocomplete
            saveValue(STORAGE_KEYS.nomes, nome);
            saveValue(STORAGE_KEYS.telefones, telefone);
            saveValue(STORAGE_KEYS.enderecos, endereco);

            // Format phone for message
            let telefoneFormatado = telefone;
            if (telefone) {
                const numbers = telefone.replace(/\D/g, '');
                if (numbers.length >= 10) {
                    telefoneFormatado = `+55 ${numbers.slice(0, 2)} ${numbers.slice(2, 7)}-${numbers.slice(7)}`;
                }
            }

            // Build message
            let message = '';
            
            if (nome) {
                message += `*NOME DO CLIENTE*: ${nome}\n`;
            }
            
            if (telefone) {
                message += `*TELEFONE*: ${telefoneFormatado}\n`;
            }
            
            if (endereco) {
                message += `\n*ENDEREÇO*: ${endereco}\n`;
            }
            
            if (notas) {
                message += `\n*NOTAS*: ${notas}\n`;
            }

            if (pago || apagar) {
                message += '\n';
                message += pago ? '*[X] PAGO*\n' : '*[ ] PAGO*\n';
                
                if (apagar && valor) {
                    message += `*[X] FALTAR PAGAR*: R$ ${valor}`;
                } else {
                    message += apagar ? '*[X] FALTAR PAGAR*' : '*[ ] FALTAR PAGAR*';
                }
            }

            output.value = message.trim();
            outputSection.classList.add('visible');
            
            // Scroll to output
            outputSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        // Clear button functionality
        const btnLimpar = document.getElementById('btn-limpar');
        
        function limparCampos() {
            document.getElementById('nome').value = '';
            document.getElementById('telefone').value = '';
            document.getElementById('endereco').value = '';
            document.getElementById('notas').value = '';
            document.getElementById('valor').value = '';
            
            // Reset payment options to default (Pago)
            pagoLabel.classList.add('active');
            apagarLabel.classList.remove('active');
            pagoInput.checked = true;
            apagarInput.checked = false;
            valorContainer.classList.remove('visible');
            
            // Hide output section
            outputSection.classList.remove('visible');
            output.value = '';
        }
        
        function confirmarLimpeza() {
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.7);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 1000;
                    backdrop-filter: blur(4px);
                `;
                
                const dialog = document.createElement('div');
                dialog.style.cssText = `
                    background: var(--bg-card);
                    border: 1px solid var(--border);
                    border-radius: 16px;
                    padding: 2rem;
                    max-width: 400px;
                    width: 90%;
                    text-align: center;
                    animation: slideIn 0.2s ease-out;
                `;
                
                dialog.innerHTML = `
                    <div style="margin-bottom: 1.5rem;">
                        <div style="font-size: 2rem; margin-bottom: 0.5rem;">⚠️</div>
                        <h3 style="color: var(--text-primary); margin-bottom: 0.5rem; font-size: 1.1rem;">Limpar todos os campos?</h3>
                        <p style="color: var(--text-secondary); font-size: 0.9rem;">Esta ação não pode ser desfeita.</p>
                    </div>
                    <div style="display: flex; gap: 0.75rem; justify-content: center;">
                        <button id="cancelar" style="
                            padding: 0.75rem 1.5rem;
                            background: var(--bg-input);
                            border: 1px solid var(--border);
                            border-radius: 8px;
                            color: var(--text-primary);
                            cursor: pointer;
                            font-family: 'DM Sans', sans-serif;
                            font-weight: 500;
                            transition: all 0.2s ease;
                        ">Cancelar</button>
                        <button id="confirmar" style="
                            padding: 0.75rem 1.5rem;
                            background: var(--warning);
                            border: 1px solid var(--warning);
                            border-radius: 8px;
                            color: var(--bg-primary);
                            cursor: pointer;
                            font-family: 'DM Sans', sans-serif;
                            font-weight: 600;
                            transition: all 0.2s ease;
                        ">Limpar</button>
                    </div>
                `;
                
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes slideIn {
                        from {
                            opacity: 0;
                            transform: scale(0.95) translateY(-10px);
                        }
                        to {
                            opacity: 1;
                            transform: scale(1) translateY(0);
                        }
                    }
                `;
                document.head.appendChild(style);
                
                modal.appendChild(dialog);
                document.body.appendChild(modal);
                
                const confirmarBtn = dialog.querySelector('#confirmar');
                const cancelarBtn = dialog.querySelector('#cancelar');
                
                function cleanup(result) {
                    document.body.removeChild(modal);
                    document.head.removeChild(style);
                    resolve(result);
                }
                
                confirmarBtn.addEventListener('click', () => cleanup(true));
                cancelarBtn.addEventListener('click', () => cleanup(false));
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) cleanup(false);
                });
                
                // Handle Enter key
                function handleKeydown(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        cleanup(true);
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        cleanup(false);
                    }
                }
                
                document.addEventListener('keydown', handleKeydown);
                
                // Focus the confirm button for Enter key functionality
                confirmarBtn.focus();
                
                // Remove event listener when done
                const originalCleanup = cleanup;
                cleanup = function(result) {
                    document.removeEventListener('keydown', handleKeydown);
                    originalCleanup(result);
                };
            });
        }
        
        btnLimpar.addEventListener('click', async () => {
            const confirmado = await confirmarLimpeza();
            if (confirmado) {
                limparCampos();
            }
        });

        // Copy functionality
        const btnCopy = document.getElementById('btn-copy');
        const copyText = document.getElementById('copy-text');

        btnCopy.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(output.value);
                btnCopy.classList.add('copied');
                copyText.textContent = 'Copiado!';
                
                setTimeout(() => {
                    btnCopy.classList.remove('copied');
                    copyText.textContent = 'Copiar';
                }, 2000);
            } catch {
                // Fallback
                output.select();
                document.execCommand('copy');
                btnCopy.classList.add('copied');
                copyText.textContent = 'Copiado!';
                
                setTimeout(() => {
                    btnCopy.classList.remove('copied');
                    copyText.textContent = 'Copiar';
                }, 2000);
            }
        });
    </script>
</body>
</html>
