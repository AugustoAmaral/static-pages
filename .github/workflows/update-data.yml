name: Update Data

on:
  schedule:
    - cron: '0 10 * * *' # 07:00 America/Sao_Paulo (BRT, UTC-3)
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch deploy-pages.yml after the bot push

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild data snapshot from official API
        run: node scripts/rebuild-data.mjs
      - name: Model regression
        run: node scripts/hunt-model.test.mjs
      - name: Commit & push if data changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain assets/)" ]; then
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/
            git commit -m "chore(data): daily snapshot refresh"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN don't fire on:push workflows (recursion
      # guard), so the Pages deploy must be dispatched explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml
